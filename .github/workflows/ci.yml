name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.runner_arch }})
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_arch: X64
            runs_on: '["self-hosted", "Linux", "X64"]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check OCI source labels
        shell: bash
        run: |
          # GHCR links a package to its repo via org.opencontainers.image.source;
          # every Containerfile/Dockerfile (incl. templates) must carry it.
          want="org.opencontainers.image.source=\"https://github.com/${GITHUB_REPOSITORY}\""
          status=0
          while IFS= read -r f; do
            grep -qF "$want" "$f" || { echo "::error file=$f::missing $want"; status=1; }
          done < <(git ls-files | grep -iE '(^|/)(containerfile|dockerfile)[^/]*$|\.(containerfile|dockerfile)(\.j2)?$' | grep -viE '\.(md|py|sh|txt|ya?ml|json)$')
          exit "$status"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Check build
        run: cargo check --locked --all-targets

      - name: Run tests
        run: cargo test --locked
