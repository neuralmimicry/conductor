name: Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v. Defaults to Cargo.toml when omitted."
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    name: Resolve release version
    runs-on: [self-hosted, Linux, X64]
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      deb_version: ${{ steps.version.outputs.deb_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail

          version="${DISPATCH_VERSION:-}"
          if [[ -z "${version}" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "${version}" ]]; then
            cargo_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
            if [[ -z "${cargo_version}" ]]; then
              echo "Unable to resolve Cargo package version from Cargo.toml" >&2
              exit 2
            fi
            git fetch --tags --force origin >/dev/null 2>&1 || true
            latest_tag_version="$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n 1)"
            if [[ -n "${latest_tag_version}" ]]; then
              candidate="$(printf '%s\n%s\n' "${cargo_version}" "${latest_tag_version}" | sort -V | tail -n 1)"
            else
              candidate="${cargo_version}"
            fi
            version="${candidate}"
            if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
              if [[ ! "${version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "Auto-bump requires stable SemVer MAJOR.MINOR.PATCH, got: ${version}" >&2
                exit 2
              fi
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
              while true; do
                patch="$((patch + 1))"
                candidate="${major}.${minor}.${patch}"
                if ! git rev-parse -q --verify "refs/tags/v${candidate}" >/dev/null; then
                  version="${candidate}"
                  break
                fi
              done
            fi
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 2
          fi

          deb_version="${version//-/~}"
          if [[ ! "${deb_version}" =~ ^[0-9][0-9A-Za-z.+~-]*$ ]]; then
            echo "Invalid Debian package version: ${deb_version}" >&2
            exit 2
          fi

          is_prerelease="false"
          if [[ "${version}" == *-* ]]; then
            is_prerelease="true"
          fi

          tag_name="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${tag_name}" ]]; then
            echo "Tag-triggered release mismatch: ref=${GITHUB_REF_NAME}, derived=${tag_name}" >&2
            exit 2
          fi

          {
            echo "app_version=${version}"
            echo "deb_version=${deb_version}"
            echo "is_prerelease=${is_prerelease}"
            echo "tag_name=${tag_name}"
          } >> "${GITHUB_OUTPUT}"

          echo "Conductor release version: ${version}"
          echo "Debian package version: ${deb_version}"
          echo "Release tag: ${tag_name}"

  build-deb:
    name: Build ${{ matrix.runner_arch }} Debian package
    needs:
      - version
      - validate
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_arch: X64
            deb_arch: amd64
            runs_on: '["self-hosted","Linux","X64"]'
          - runner_arch: ARM64
            deb_arch: arm64
            runs_on: '["self-hosted","Linux","ARM64"]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure packaging tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dpkg-deb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends dpkg
          fi
          if command -v podman >/dev/null 2>&1 && podman --version >/dev/null 2>&1; then
            bash scripts/ci-podman.sh --prepare
            container_runtime="podman"
          elif command -v docker >/dev/null 2>&1 && env -u DOCKER_HOST docker info >/dev/null 2>&1; then
            echo "CONTAINER_RUNTIME_ARGS=" >>"${GITHUB_ENV}"
            echo "CONTAINER_RUNTIME=docker" >>"${GITHUB_ENV}"
            echo "DOCKER_HOST=" >>"${GITHUB_ENV}"
            container_runtime="docker"
          else
            echo "No usable Podman or Docker runtime is available" >&2
            exit 1
          fi

      - name: Build Debian package in bookworm toolchain container
        shell: bash
        run: |
          set -euo pipefail
          network_args=()
          if [[ "$CONTAINER_RUNTIME" != docker ]]; then network_args=(--network=slirp4netns); fi
          image_ref="localhost/conductor-release-build-${{ matrix.deb_arch }}:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_name="conductor-release-build-${{ matrix.deb_arch }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # shellcheck disable=SC2086
          "${CONTAINER_RUNTIME}" ${CONTAINER_RUNTIME_ARGS:-} build \
            "${network_args[@]}" \
            --target source-deb \
            --build-arg "CONDUCTOR_VERSION=${{ needs.version.outputs.app_version }}" \
            -f Containerfile \
            -t "${image_ref}" \
            .
          # shellcheck disable=SC2086
          "${CONTAINER_RUNTIME}" ${CONTAINER_RUNTIME_ARGS:-} create --name "${container_name}" "${image_ref}" >/dev/null
          mkdir -p dist
          # shellcheck disable=SC2086
          "${CONTAINER_RUNTIME}" ${CONTAINER_RUNTIME_ARGS:-} cp "${container_name}:/out/conductor_${{ needs.version.outputs.deb_version }}_${{ matrix.deb_arch }}.deb" dist/
          # A self-hosted runner may retain an external build container that
          # references this image. Cleanup must not turn a valid artifact into
          # a failed job in that case.
          # shellcheck disable=SC2086
          "${CONTAINER_RUNTIME}" ${CONTAINER_RUNTIME_ARGS:-} rm -f "${container_name}" >/dev/null 2>&1 || true

      - name: Inspect Debian package
        run: dpkg-deb --info "dist/conductor_${{ needs.version.outputs.deb_version }}_${{ matrix.deb_arch }}.deb"

      - name: Attest Debian package source and build
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/*.deb

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: conductor-deb-${{ matrix.deb_arch }}
          path: dist/*.deb
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs:
      - version
      - build-deb
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      - name: Download Debian packages
        uses: actions/download-artifact@v4
        with:
          pattern: conductor-deb-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum *.deb > SHA256SUMS

      - name: Preserve existing tag and asset identities
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag_name }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const request = async path => {
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/${path}`, {
              headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'},
              signal: AbortSignal.timeout(15000)
            });
            if (response.status === 404) return null;
            if (!response.ok) throw Error('Release identity observation failed');
            return response.json();
          };
          const tag = encodeURIComponent(process.env.RELEASE_TAG);
          const commit = await request(`commits/refs%2Ftags%2F${tag}`);
          if (commit && commit.sha !== process.env.GITHUB_SHA) throw Error('Existing release tag belongs to another source');
          const release = await request(`releases/tags/${tag}`);
          if (release) {
            if (!commit) throw Error('Existing release has no verifiable source tag');
            for (const name of fs.readdirSync('release-assets')) {
              const asset = release.assets.find(asset => asset.name === name);
              if (!asset) continue;
              const digest = 'sha256:' + crypto.createHash('sha256').update(fs.readFileSync(`release-assets/${name}`)).digest('hex');
              if (asset.digest !== digest) throw Error('Existing immutable release asset differs; publish a new version');
            }
          }
          JS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Conductor v${{ needs.version.outputs.app_version }}
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.is_prerelease != 'true' }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.deb
            release-assets/SHA256SUMS

  build-container-arch:
    name: Build container (${{ matrix.arch }})
    needs:
      - version
      - github-release
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner_arch: X64
            target_page_size: 4k
            runs_on: '["self-hosted","Linux","X64"]'
          - arch: arm64
            runner_arch: ARM64
            target_page_size: 4k
            runs_on: '["self-hosted","Linux","ARM64"]'
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository }}
      IMAGE_VERSION: ${{ needs.version.outputs.app_version }}
      IMAGE_TAG: ${{ needs.version.outputs.tag_name }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare rootless Podman
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends podman
            else
              echo "Podman is required on the image-build runner" >&2
              exit 1
            fi
          fi
          podman --version
          bash scripts/ci-podman.sh --prepare

      - name: Log in to GHCR
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GHCR_USERNAME}" || { echo "No GHCR username available" >&2; exit 1; }
          test -n "${GHCR_TOKEN}" || { echo "No GHCR token available" >&2; exit 1; }
          printf '%s' "${GHCR_TOKEN}" | "${CONTAINER_RUNTIME}" login ghcr.io \
            --username "${GHCR_USERNAME}" --password-stdin

      - name: Build and push architecture image
        id: image
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          PAGE_SIZE: ${{ matrix.target_page_size }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REPO}:${IMAGE_VERSION}-${ARCH}"
          iid_file="$(mktemp)"
          trap 'rm -f "${iid_file}"' EXIT
          podman_build_runtime_args=()
          if [[ "${ARCH}" == "arm64" ]] && command -v runc >/dev/null 2>&1; then
            podman_build_runtime_args+=(--runtime "$(command -v runc)")
          fi
          "${CONTAINER_RUNTIME}" "${podman_build_runtime_args[@]}" build \
            --network=slirp4netns \
            --pull \
            --build-arg "CONDUCTOR_VERSION=source" \
            --build-arg "CONDUCTOR_SOURCE_VERSION=${IMAGE_VERSION}" \
            --build-arg "TARGET_PAGE_SIZE=${PAGE_SIZE}" \
            --iidfile "${iid_file}" \
            -f Containerfile \
            -t "${image_ref}" \
            .
          image_id="$(tr -d '\n' <"${iid_file}")"
          test -n "${image_id}" || { echo "Podman did not emit an image ID" >&2; exit 1; }
          digest_file="${RUNNER_TEMP}/conductor-${ARCH}-registry-digest"
          "${CONTAINER_RUNTIME}" push --digestfile "${digest_file}" "${image_id}" "docker://${image_ref}"
          digest="$(tr -d '\n' <"${digest_file}")"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Invalid registry digest" >&2; exit 1; }
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest architecture image source and build
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.image.outputs.digest }}

  publish-container:
    name: Publish multi-arch container
    needs:
      - version
      - build-container-arch
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository }}
      IMAGE_VERSION: ${{ needs.version.outputs.app_version }}
      IMAGE_TAG: ${{ needs.version.outputs.tag_name }}
      COMMIT_SHORT: ${{ github.sha }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare rootless Podman
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null 2>&1; then
            echo "Podman is required on the manifest runner" >&2
            exit 1
          fi
          podman --version
          # Keep the manifest job's rootless Podman state isolated from a
          # runner-wide user session.  Reusing /run/user/<uid> after the
          # architecture builds can leave Podman trying to re-enter a stale
          # user namespace (exit 125: cannot re-exec process to join the
          # existing user namespace).
          bash scripts/ci-podman.sh --prepare

      - name: Log in to GHCR
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GHCR_USERNAME}" || { echo "No GHCR username available" >&2; exit 1; }
          test -n "${GHCR_TOKEN}" || { echo "No GHCR token available" >&2; exit 1; }
          printf '%s' "${GHCR_TOKEN}" | "${CONTAINER_RUNTIME}" login ghcr.io \
            --username "${GHCR_USERNAME}" --password-stdin

      - name: Create and push multi-arch tags
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="conductor-manifest-${IMAGE_VERSION}"
          "${CONTAINER_RUNTIME}" manifest rm "${manifest}" >/dev/null 2>&1 || true
          "${CONTAINER_RUNTIME}" manifest create "${manifest}"
          "${CONTAINER_RUNTIME}" manifest add "${manifest}" \
            "docker://${IMAGE_REPO}:${IMAGE_VERSION}-amd64"
          "${CONTAINER_RUNTIME}" manifest add "${manifest}" \
            "docker://${IMAGE_REPO}:${IMAGE_VERSION}-arm64"
          for tag in latest "${IMAGE_VERSION}" "${IMAGE_TAG}" "${COMMIT_SHORT}"; do
            digest_file="${RUNNER_TEMP}/conductor-manifest-registry-digest"
            "${CONTAINER_RUNTIME}" manifest push --all --digestfile "${digest_file}" "${manifest}" \
              "docker://${IMAGE_REPO}:${tag}"
            digest="$(tr -d '\n' <"${digest_file}")"
            [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Invalid manifest digest" >&2; exit 1; }
            if [[ -n "${expected_digest:-}" && "${digest}" != "${expected_digest}" ]]; then
              echo "Published tags have inconsistent immutable digests" >&2
              exit 1
            fi
            expected_digest="${digest}"
          done
          echo "digest=${expected_digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest multi-architecture image source and build
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
