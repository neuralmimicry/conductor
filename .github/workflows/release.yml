name: Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v. Defaults to Cargo.toml when omitted."
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve release version
    runs-on: [self-hosted, Linux, X64]
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      deb_version: ${{ steps.version.outputs.deb_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail

          version="${DISPATCH_VERSION:-}"
          if [[ -z "${version}" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "${version}" ]]; then
            cargo_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
            if [[ -z "${cargo_version}" ]]; then
              echo "Unable to resolve Cargo package version from Cargo.toml" >&2
              exit 2
            fi
            git fetch --tags --force origin >/dev/null 2>&1 || true
            latest_tag_version="$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n 1)"
            if [[ -n "${latest_tag_version}" ]]; then
              candidate="$(printf '%s\n%s\n' "${cargo_version}" "${latest_tag_version}" | sort -V | tail -n 1)"
            else
              candidate="${cargo_version}"
            fi
            version="${candidate}"
            if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
              if [[ ! "${version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "Auto-bump requires stable SemVer MAJOR.MINOR.PATCH, got: ${version}" >&2
                exit 2
              fi
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
              while true; do
                patch="$((patch + 1))"
                candidate="${major}.${minor}.${patch}"
                if ! git rev-parse -q --verify "refs/tags/v${candidate}" >/dev/null; then
                  version="${candidate}"
                  break
                fi
              done
            fi
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 2
          fi

          deb_version="${version//-/~}"
          if [[ ! "${deb_version}" =~ ^[0-9][0-9A-Za-z.+~-]*$ ]]; then
            echo "Invalid Debian package version: ${deb_version}" >&2
            exit 2
          fi

          is_prerelease="false"
          if [[ "${version}" == *-* ]]; then
            is_prerelease="true"
          fi

          tag_name="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${tag_name}" ]]; then
            echo "Tag-triggered release mismatch: ref=${GITHUB_REF_NAME}, derived=${tag_name}" >&2
            exit 2
          fi

          {
            echo "app_version=${version}"
            echo "deb_version=${deb_version}"
            echo "is_prerelease=${is_prerelease}"
            echo "tag_name=${tag_name}"
          } >> "${GITHUB_OUTPUT}"

          echo "Conductor release version: ${version}"
          echo "Debian package version: ${deb_version}"
          echo "Release tag: ${tag_name}"

  build-deb:
    name: Build ${{ matrix.runner_arch }} Debian package
    needs: version
    runs-on: [self-hosted, Linux, "${{ matrix.runner_arch }}"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_arch: X64
            deb_arch: amd64
          - runner_arch: ARM64
            deb_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure packaging tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dpkg-deb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends dpkg
          fi
          if command -v podman >/dev/null 2>&1 && podman --version >/dev/null 2>&1; then
            # Some self-hosted runners do not start a user systemd session.
            # Give rootless Podman a private runtime directory instead of
            # relying on the absent /run/user/<uid> path.
            podman_runtime_dir="${RUNNER_TEMP}/podman-runtime"
            mkdir -p "${podman_runtime_dir}"
            chmod 700 "${podman_runtime_dir}"
            echo "XDG_RUNTIME_DIR=${podman_runtime_dir}" >>"${GITHUB_ENV}"
            echo "CONTAINER_RUNTIME=podman" >>"${GITHUB_ENV}"
            container_runtime="podman"
          elif command -v docker >/dev/null 2>&1 && env -u DOCKER_HOST docker info >/dev/null 2>&1; then
            echo "CONTAINER_RUNTIME=docker" >>"${GITHUB_ENV}"
            echo "DOCKER_HOST=" >>"${GITHUB_ENV}"
            container_runtime="docker"
          else
            echo "No usable Podman or Docker runtime is available" >&2
            exit 1
          fi
          # Rootless self-hosted runners may not have a user systemd session.
          # Explicitly use cgroupfs so crun does not attempt an interactive
          # sd-bus authentication call while creating the build container.
          if [[ "${container_runtime}" == "podman" ]]; then
            echo "CONTAINER_RUNTIME_ARGS=--cgroup-manager=cgroupfs" >>"${GITHUB_ENV}"
          else
            echo "CONTAINER_RUNTIME_ARGS=" >>"${GITHUB_ENV}"
          fi

      - name: Build Debian package in bookworm toolchain container
        shell: bash
        run: |
          set -euo pipefail
          image_ref="localhost/conductor-release-build-${{ matrix.deb_arch }}:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_name="conductor-release-build-${{ matrix.deb_arch }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # shellcheck disable=SC2086
          "${CONTAINER_RUNTIME}" ${CONTAINER_RUNTIME_ARGS:-} build \
            --target source-deb \
            --build-arg "CONDUCTOR_VERSION=${{ needs.version.outputs.app_version }}" \
            -f Containerfile \
            -t "${image_ref}" \
            .
          # shellcheck disable=SC2086
          "${CONTAINER_RUNTIME}" ${CONTAINER_RUNTIME_ARGS:-} create --name "${container_name}" "${image_ref}" >/dev/null
          mkdir -p dist
          # shellcheck disable=SC2086
          "${CONTAINER_RUNTIME}" ${CONTAINER_RUNTIME_ARGS:-} cp "${container_name}:/out/conductor_${{ needs.version.outputs.deb_version }}_${{ matrix.deb_arch }}.deb" dist/
          # A self-hosted runner may retain an external build container that
          # references this image. Cleanup must not turn a valid artifact into
          # a failed job in that case.
          # shellcheck disable=SC2086
          "${CONTAINER_RUNTIME}" ${CONTAINER_RUNTIME_ARGS:-} rm -f "${container_name}" >/dev/null 2>&1 || true

      - name: Inspect Debian package
        run: dpkg-deb --info "dist/conductor_${{ needs.version.outputs.deb_version }}_${{ matrix.deb_arch }}.deb"

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: conductor-deb-${{ matrix.deb_arch }}
          path: dist/*.deb
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs:
      - version
      - build-deb
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Download Debian packages
        uses: actions/download-artifact@v4
        with:
          pattern: conductor-deb-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum *.deb > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Conductor v${{ needs.version.outputs.app_version }}
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.is_prerelease != 'true' }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.deb
            release-assets/SHA256SUMS

  build-container-arch:
    name: Build container (${{ matrix.arch }})
    needs:
      - version
      - github-release
    runs-on: [self-hosted, Linux, "${{ matrix.runner_arch }}"]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner_arch: X64
            target_page_size: 4k
          - arch: arm64
            runner_arch: ARM64
            target_page_size: 4k
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository }}
      IMAGE_VERSION: ${{ needs.version.outputs.app_version }}
      IMAGE_TAG: ${{ needs.version.outputs.tag_name }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare rootless Podman
        shell: bash
        run: |
          set -euo pipefail
          command -v podman >/dev/null 2>&1 || {
            echo "Podman is required on the self-hosted runner" >&2
            exit 1
          }
          podman_runtime_dir="${RUNNER_TEMP}/podman-runtime"
          mkdir -p "${podman_runtime_dir}"
          chmod 700 "${podman_runtime_dir}"
          echo "XDG_RUNTIME_DIR=${podman_runtime_dir}" >>"${GITHUB_ENV}"

      - name: Log in to GHCR
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GHCR_USERNAME}" || { echo "No GHCR username available" >&2; exit 1; }
          test -n "${GHCR_TOKEN}" || { echo "No GHCR token available" >&2; exit 1; }
          printf '%s' "${GHCR_TOKEN}" | podman --cgroup-manager=cgroupfs login ghcr.io \
            --username "${GHCR_USERNAME}" --password-stdin

      - name: Build and push architecture image
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          PAGE_SIZE: ${{ matrix.target_page_size }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REPO}:${IMAGE_VERSION}-${ARCH}"
          iid_file="$(mktemp)"
          trap 'rm -f "${iid_file}"' EXIT
          podman --cgroup-manager=cgroupfs build \
            --pull \
            --build-arg "CONDUCTOR_VERSION=source" \
            --build-arg "TARGET_PAGE_SIZE=${PAGE_SIZE}" \
            --iidfile "${iid_file}" \
            -f Containerfile \
            -t "${image_ref}" \
            .
          image_id="$(tr -d '\n' <"${iid_file}")"
          test -n "${image_id}" || { echo "Podman did not emit an image ID" >&2; exit 1; }
          podman --cgroup-manager=cgroupfs push "${image_id}" "docker://${image_ref}"

  publish-container:
    name: Publish multi-arch container
    needs:
      - version
      - build-container-arch
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository }}
      IMAGE_VERSION: ${{ needs.version.outputs.app_version }}
      IMAGE_TAG: ${{ needs.version.outputs.tag_name }}
      COMMIT_SHORT: ${{ github.sha }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
    steps:
      - name: Log in to GHCR
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GHCR_USERNAME}" || { echo "No GHCR username available" >&2; exit 1; }
          test -n "${GHCR_TOKEN}" || { echo "No GHCR token available" >&2; exit 1; }
          printf '%s' "${GHCR_TOKEN}" | podman --cgroup-manager=cgroupfs login ghcr.io \
            --username "${GHCR_USERNAME}" --password-stdin

      - name: Create and push multi-arch tags
        shell: bash
        run: |
          set -euo pipefail
          manifest="conductor-manifest-${IMAGE_VERSION}"
          podman --cgroup-manager=cgroupfs manifest rm "${manifest}" >/dev/null 2>&1 || true
          podman --cgroup-manager=cgroupfs manifest create "${manifest}"
          podman --cgroup-manager=cgroupfs manifest add "${manifest}" \
            "docker://${IMAGE_REPO}:${IMAGE_VERSION}-amd64"
          podman --cgroup-manager=cgroupfs manifest add "${manifest}" \
            "docker://${IMAGE_REPO}:${IMAGE_VERSION}-arm64"
          for tag in latest "${IMAGE_VERSION}" "${IMAGE_TAG}" "${COMMIT_SHORT}"; do
            podman --cgroup-manager=cgroupfs manifest push --all "${manifest}" \
              "docker://${IMAGE_REPO}:${tag}"
          done
